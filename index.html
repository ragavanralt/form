<!doctype html>
<html lang="en" data-theme="dark" data-acc="sage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stack">
<meta name="theme-color" content="#09090b">
<meta name="description" content="Food, training and habits in one daily score. AI photo logging, workouts with PRs, and friends who keep you honest.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  // Paint the right theme before the app loads, so there is no flash.
  try { const s = JSON.parse(localStorage.getItem('form2:state') || '{}').settings || {}; const t = new URLSearchParams(location.search).get('theme') || s.theme || 'dark';
    document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
    document.documentElement.dataset.acc = s.accent || 'lime'; } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <main id="views">
    <section id="v-today" class="view on" aria-label="Today"></section>
    <section id="v-train" class="view" aria-label="Train"></section>
    <section id="v-friends" class="view" aria-label="Friends"></section>
    <section id="v-progress" class="view" aria-label="Progress"></section>
  </main>
  <div id="dock" hidden></div>
  <nav id="tabbar" aria-label="Main"></nav>
</div>
<div id="sheetwrap" hidden><div class="scrim" data-act="closeSheet"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="onboard" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx"></canvas>
<noscript>Stack needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
