<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Form">
<meta name="theme-color" content="#000000">
<meta name="description" content="A matchday-style daily tracker for food, training and cardio.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;1,500&display=swap">
<style>
/* Layout: one 560px phone column; floating tab bar; bottom sheets for every input.
   Single dark look on purpose (OLED black). White is calories and chrome; color only ever means data:
   orange protein, blue training, green steps. Emphasis by size, color and italics, never heavy weights. */
:root{
  color-scheme:dark;
  --bg:#000000;--s1:#111111;--s2:#1a1a1a;--s3:#252525;--line:#262626;--line2:#363636;
  --ink:#f4f4f1;--ink2:#b6b6af;--ink3:#8c8c86;
  --cal:#f4f4f1;--pro:#e0692c;--tr:#4a8cff;--st:#16a07a;
  --gold:#d9b65c;--silver:#c3c7cf;--bronze:#b5835a;
  --disp:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;font-weight:400;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:45;pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[data-act]:focus-visible{outline:2px solid var(--tr);outline-offset:2px}
em{font-style:italic;color:var(--ink)}
.disp{font-family:var(--disp);font-weight:500;letter-spacing:.005em}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.small{font-size:13px}.tiny{font-size:12px}
[hidden]{display:none!important}

#views{max-width:560px;margin:0 auto;padding-block:10px calc(124px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:none;flex-direction:column;gap:14px}
.view.on{display:flex}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 2px 2px}
.vhead h1{font-family:var(--disp);font-weight:500;font-size:40px;line-height:.9;margin:0}
.vhead .sub{color:var(--ink3);font-size:13px;margin-top:5px}
.card{background:var(--s1);border-radius:22px;padding:16px}
.card.flat{background:transparent;border:1px solid var(--line)}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--ink3);font-size:13px;margin-bottom:10px}
.label b{font-weight:400;color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line);margin:12px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:500;background:var(--ink);color:#000;min-height:46px;white-space:nowrap}
.btn.ghost{background:var(--s2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btn.tr{background:var(--tr);color:#000}
.btn:disabled{opacity:.45}
.link{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--ink3);text-underline-offset:3px;font-size:13px}
.chipbtn{border:1px solid var(--line2);border-radius:99px;padding:7px 12px;font-size:13px;color:var(--ink2);background:transparent}
.chipbtn.on{background:var(--ink);color:#000;border-color:var(--ink)}
.icon{width:20px;height:20px;display:inline-block;flex:none}

/* top of Today */
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 2px 0}
.wordmark{font-family:var(--disp);font-size:30px;font-weight:500;line-height:1;letter-spacing:-.005em}
.minute{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:99px;padding:5px 11px 5px 9px;font-family:var(--disp);font-size:17px;line-height:1}
.minute i{width:7px;height:7px;border-radius:50%;background:var(--st);box-shadow:0 0 0 0 rgba(22,160,122,.6);animation:live 2s infinite}
.minute.ft i{background:var(--ink3);animation:none}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(22,160,122,.5)}70%{box-shadow:0 0 0 7px rgba(22,160,122,0)}100%{box-shadow:0 0 0 0 rgba(22,160,122,0)}}

/* scoreboard */
.board{position:relative;overflow:hidden;border-radius:26px;background:var(--s1);padding:18px 18px 16px}
.board .pitch{position:absolute;right:-70px;top:-70px;width:230px;height:230px;opacity:.5;pointer-events:none}
.board-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;color:var(--ink3);font-size:13px;position:relative}
.hello2{display:block;font-family:var(--disp);font-size:24px;line-height:1;color:var(--ink);margin-bottom:4px}
.score{display:flex;align-items:flex-end;gap:16px;margin:18px 0 16px;position:relative}
.score .big{font-family:var(--disp);font-size:96px;line-height:.78;font-weight:500;font-variant-numeric:tabular-nums}
.score .of{font-family:var(--disp);font-size:24px;color:var(--ink3);margin-left:-10px;line-height:1}
.score .state{padding-bottom:4px}
.score .state b{display:block;font-family:var(--disp);font-weight:500;font-size:26px;line-height:1}
.score .state span{color:var(--ink2);font-size:14px}
.pips,.piplabels{display:grid;grid-template-columns:3fr 2fr 2fr 2fr 1fr;gap:10px;position:relative}
.pg{display:flex;gap:4px}
.pg i{flex:1;height:10px;border-radius:3px;background:var(--s3)}
.piplabels{margin-top:7px;font-size:11px;color:var(--ink3)}
.piplabels span{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.piplabels b{font-weight:400;color:var(--ink2)}

.formrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 2px}
.guide{display:flex;gap:6px}
.res{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--disp);font-size:17px;font-weight:500}
.res.W{background:var(--ink);color:#000}
.res.D{background:var(--s2);color:var(--ink2);border:1px solid var(--line2)}
.res.L{color:var(--ink3);border:1.5px dashed var(--line2)}
.res.S{color:var(--ink);border:1.5px solid var(--ink3)}
.res.N{color:var(--s3);border:1px solid var(--line)}
.res.lg{width:56px;height:56px;border-radius:14px;font-size:32px}
.subs{display:flex;gap:6px;align-items:center;color:var(--ink3);font-size:13px}
.subs i{width:12px;height:18px;border-radius:3px;border:1.5px solid var(--ink3)}
.subs i.on{background:var(--ink);border-color:var(--ink)}

/* fuel */
.kcal{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.kcal .n{font-family:var(--disp);font-size:46px;line-height:.85;font-weight:500}
.kcal .n small{font-family:var(--body);font-size:13px;color:var(--ink2);margin-left:6px;font-weight:400}
.kbar{position:relative;height:12px;border-radius:6px;background:var(--s3);margin:14px 0 8px;overflow:visible}
.kbar .band{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(244,244,241,.18) 0 3px,transparent 3px 7px);border-radius:3px}
.kbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--cal)}
.kbar .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.kmeta{display:flex;justify-content:space-between;color:var(--ink3);font-size:12px}
.ptspill{font-size:12px;color:var(--ink2);border:1px solid var(--line2);border-radius:99px;padding:3px 9px;white-space:nowrap}
.prohead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prohead .n{font-family:var(--disp);font-size:30px;line-height:1}
.prohead .n small{font-size:17px;color:var(--ink3)}
.chart{display:block;width:100%;height:auto}
.ct{font-size:9.5px;fill:var(--ink3);font-family:var(--body)}
.cv{font-size:11px;fill:var(--ink);font-family:var(--disp)}

/* gaffer */
.gaffer{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.gaffer .who{width:34px;height:34px;border-radius:50%;background:var(--s3);display:grid;place-items:center}
.gaffer p{margin:2px 0 10px;font-size:15px;color:var(--ink);line-height:1.4}
.gaffer small{display:block;color:var(--ink3);font-size:12px;margin-bottom:2px}

/* fixture */
.fixture{position:relative;overflow:hidden;border-radius:22px;padding:16px;background:var(--s1)}
.fixture.liftday{background:linear-gradient(160deg,rgba(74,140,255,.16),var(--s1) 55%)}
.fixture h2{font-family:var(--disp);font-weight:500;font-size:40px;line-height:.9;margin:4px 0 6px}
.fixture p{margin:0 0 12px;color:var(--ink2);font-size:14px}
.fixture .exlist{color:var(--ink3);font-size:12px;margin:-4px 0 14px;line-height:1.5}

/* meals */
.mgroup+.mgroup{margin-top:10px}
.mhead{display:flex;justify-content:space-between;color:var(--ink3);font-size:12px;padding:0 0 6px}
.meal{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.meal .em{width:38px;height:38px;border-radius:12px;background:var(--s2);display:grid;place-items:center;font-size:19px}
.meal .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal .mac{display:block;color:var(--ink3);font-size:12px}
.meal .kc{text-align:right;font-family:var(--disp);font-size:18px;line-height:1}
.meal .kc small{display:block;font-family:var(--body);font-size:11px;color:var(--pro)}
.addrow{display:flex;align-items:center;gap:10px;padding:10px 0 2px;color:var(--ink2);font-size:14px;width:100%;border-top:1px solid var(--line)}
.addrow .plus{width:38px;height:38px;border-radius:12px;border:1px dashed var(--line2);display:grid;place-items:center;font-size:18px;color:var(--ink3)}

/* habits */
.habits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.habit{background:var(--s1);border-radius:16px;padding:12px 10px;text-align:left;display:grid;gap:3px;min-height:76px}
.habit small{color:var(--ink3);font-size:11px}
.habit b{font-family:var(--disp);font-weight:500;font-size:20px;line-height:1}
.habit .bar{height:3px;border-radius:2px;background:var(--s3);overflow:hidden;margin-top:4px}
.habit .bar i{display:block;height:100%}
.habit.on{box-shadow:inset 0 0 0 1px var(--line2)}

.ftbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:18px;padding:16px;border:1px solid var(--line2);font-size:15px;font-weight:500}
.ftbtn.hot{background:var(--ink);color:#000;border-color:var(--ink)}

.banner{border-radius:20px;padding:14px 16px;background:repeating-linear-gradient(90deg,var(--s1) 0 16px,var(--s2) 16px 32px)}
.banner b{font-weight:500}

/* tab bar */
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 24px));z-index:30;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;background:rgba(20,20,20,.88);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line2);border-radius:26px;padding:6px}
.tab{display:grid;justify-items:center;gap:3px;padding:6px 0;color:var(--ink3);font-size:11px}
.tab.on{color:var(--ink)}
.tab svg{width:22px;height:22px}
.plusbtn{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#000;display:grid;place-items:center;justify-self:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.plusbtn svg{width:24px;height:24px}

/* rest + session bar */
body:has(#dock:not([hidden])) #views{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 24px));z-index:29}
.dock{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:rgba(28,28,28,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:22px;padding:10px 12px}
.dock .t{font-family:var(--disp);font-size:28px;line-height:1}
.dock small{display:block;color:var(--ink3);font-size:12px}
.dock .acts{display:flex;gap:6px}

/* sheets */
#sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheetwrap .scrim{position:absolute;inset:0;background:rgba(0,0,0,.66)}
.sheet{position:relative;width:min(560px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - 16px);overflow:auto;background:#0d0d0d;border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.shead h3{font-family:var(--disp);font-weight:500;font-size:30px;line-height:1;margin:0}
.x{width:34px;height:34px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--ink2);font-size:20px;line-height:1}
.sec{margin-top:18px}
.sec>.label{margin-bottom:8px}
.field{display:grid;gap:6px}
.field>span{font-size:12px;color:var(--ink3)}
input[type=text],input[type=number],input:not([type]),textarea,select{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:12px 13px;font-size:16px;outline:none}
textarea{min-height:92px;resize:vertical;line-height:1.4}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.emojis{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:10px;background:var(--s2);font-size:18px}
.emojis button.on{outline:2px solid var(--ink)}
.review{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.review+.review{margin-top:8px}
.review .r1{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.review .r2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.review .r2 input{padding:9px 8px;font-size:15px;text-align:center}
.review .r2 label{display:grid;gap:3px;font-size:10px;color:var(--ink3);text-align:center}
.review .note{font-size:12px;color:var(--ink3)}
.paste{display:grid;gap:3px;text-align:left;width:100%;background:var(--ink);color:#000;border-radius:18px;padding:14px 16px}
.paste b{font-weight:500;font-size:16px}
.paste small{color:#444;font-size:12px}
.gotos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goto{background:var(--s1);border-radius:15px;padding:11px;text-align:left;display:grid;gap:2px;min-width:0}
.goto .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goto .p{font-family:var(--disp);font-size:20px;line-height:1.05}
.goto small{color:var(--ink3);font-size:11px}
.goto .bar{height:3px;border-radius:2px;background:var(--s3);overflow:hidden;margin-top:6px}
.goto .bar i{display:block;height:100%;background:var(--pro)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick button{background:var(--s1);border-radius:14px;padding:12px 4px;display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.quick svg{width:20px;height:20px;color:var(--ink)}
.thinking{display:flex;gap:10px;align-items:center;color:var(--ink2);font-size:14px;padding:10px 0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--ink);background:var(--s2);border-radius:12px;padding:10px 12px;font-size:13px}

/* train */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{background:var(--s1);border-radius:13px;padding:9px 2px 8px;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--ink3);min-width:0}
.wd b{font-family:var(--disp);font-weight:500;font-size:16px;color:var(--ink);line-height:1}
.wd.rest b{color:var(--ink3)}
.wd.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.wd.done b{color:var(--tr)}
.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
.li .t{display:block}
.li .s{display:block;color:var(--ink3);font-size:12px;margin-top:1px}
.li .r{text-align:right;color:var(--ink2);font-size:13px}
.shead2{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:2px}
.shead2 h1{font-family:var(--disp);font-weight:500;font-size:44px;line-height:.9;margin:0}
.shead2 .sub{color:var(--ink3);font-size:13px;margin-top:5px}
.prog{height:4px;border-radius:2px;background:var(--s3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--tr);transition:width .3s}
.ex{background:var(--s1);border-radius:20px;padding:14px}
.ex.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left;border-radius:16px}
.ex.mini .t{font-size:14px}
.ex.mini .s{font-size:12px;color:var(--ink3)}
.ex.mini.done .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tr);margin-right:8px;vertical-align:1px}
.ex.mini.skip{opacity:.5}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exh .nm{font-family:var(--disp);font-weight:500;font-size:26px;line-height:1}
.exh .meta{color:var(--ink3);font-size:12px;margin-top:4px}
.hint{font-size:13px;color:var(--ink2);margin:10px 0 4px}
.hint em{color:var(--tr)}
.stall{font-size:12px;color:var(--ink2);background:var(--s2);border-radius:10px;padding:8px 10px;margin-top:8px}
.sets{display:grid;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:34px 72px minmax(0,1fr) minmax(0,1fr) 44px;gap:7px;align-items:center}
.set.h{font-size:11px;color:var(--ink3)}
.set.h span:nth-child(3),.set.h span:nth-child(4){text-align:center}
.kind{height:32px;border-radius:9px;font-family:var(--disp);font-size:16px;color:var(--ink2);background:var(--s2)}
.kind.W,.kind.D,.kind.F{color:var(--ink);border:1px solid var(--line2);background:transparent}
.prev{font-size:12px;color:var(--ink3);text-align:left;padding:4px 0}
.set input{padding:10px 4px;text-align:center;font-family:var(--disp);font-size:19px;border-radius:11px}
.ck{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--ink3)}

/* ---------- scoring engine ---------- */
function totals(d){let cal=0,p=0,c=0,f=0;(d.meals||[]).forEach(m=>{cal+=+m.cal||0;p+=+m.p||0;c+=+m.c||0;f+=+m.f||0});return{cal,p,c,f}}
function fixture(k){const o=S.fxOv&&S.fxOv[k];if(o&&o.f)return o.f;return S.fixtures[pdk(k).getDay()]||'Rest'}
function doneLifts(k){const d=get(k);return d.wo&&d.wo.status==='done'?[d.wo.type||d.wo.name]:[]}
function coveredBefore(name,k){const ws=wkStart(k);let n=0;for(let i=0;i<7;i++){const j=addDays(ws,i);if(j>=k)break;if(doneLifts(j).includes(name))n++;if(fixture(j)===name)n--}return n}
function suggestFx(k){const fx=fixture(k);if(fx==='Rest'||coveredBefore(fx,k)<=0)return fx;const we=addDays(wkStart(k),6);for(let j=addDays(k,1);j<=we;j=addDays(j,1)){const c=fixture(j);if(c==='Rest'||c===fx)continue;if(coveredBefore(c,k)<=0)return c}return fx}
function swapHTML(k,fx,done){let h=done&&fx!=='Rest'?'':`<button class="btn ghost sm" data-act="swapDay">${fx==='Rest'?'Move rest day to tomorrow':'Swap with tomorrow'}</button>`;if(S.fxOv&&S.fxOv[k])h+=`<button class="link" data-act="swapUndo">Undo swap</button>`;return h}
function cardioAsk(){if(cardioMin(get(todayK()))>0)return;openSheet('cask','Get your cardio in',`<p class="muted" style="margin:0 0 12px">Cardio is worth 2 points. A 30 minute incline walk after lifting covers it.</p><button class="btn wide" data-act="cardioQuick">I did 30 min incline</button><div class="row" style="margin-top:8px"><button class="btn ghost grow" data-act="cardioOther">Different cardio</button><button class="btn ghost grow" data-act="closeSheet">Not now</button></div>`)}
function liftDone(d){return !!(d.wo&&d.wo.status==='done'&&d.wo.ex.some(e=>e.sets.some(s=>s.done&&s.k!=='W')))}
function calPts(cal,logged){if(!logged)return 0;return [0,1,1,2,3][calPts4(cal)]}
function calPts4(cal){const T=S.targets.cal,x=cal-T,m=S.profile.mode;
  if(m==='bulk'){if(x<=-300)return 0;if(x<-200)return 2;if(x<-100)return 3;return 4}
  if(m==='maintain'){const a=Math.abs(x);return a<=150?4:a<=300?3:a<=450?2:a<=600?1:0}
  if(x>=300)return 0;if(x>200)return 2;if(x>100)return 3;if(x>=-600)return 4;if(x>=-900)return 3;return 2}
const BUF=100;
const calKind=()=>{const m=S.profile.mode;return m==='bulk'||m==='maintain'?m:'cut'};
function calWindow(){const T=S.targets.cal,m=calKind();return m==='bulk'?[T-BUF,T+300]:m==='maintain'?[T-150,T+150]:[T-600,T+BUF]}
function calNote(){const T=S.targets.cal,m=calKind(),[w0,w1]=calWindow();return m==='cut'?`Goal ${fmt(T)}, buffer to ${fmt(w1)}, floor ${fmt(w0)}`:m==='bulk'?`Goal ${fmt(T)}, buffer down to ${fmt(w0)}`:`Window ${fmt(w0)} to ${fmt(w1)}`}
function calHow(){const T=S.targets.cal,m=calKind(),[w0,w1]=calWindow();return m==='cut'?`Your goal is ${fmt(T)}. ${fmt(w0)} to ${fmt(w1)} gets all 3. Under your goal is fine down to the floor, so eat enough. The top ${BUF} is a buffer for estimate error, not extra food to use.`:m==='bulk'?`Your goal is ${fmt(T)}. Anything over it gets all 3. The ${BUF} just under it is a buffer for estimate error, not a target.`:`${fmt(w0)} to ${fmt(w1)} kcal gets all 3`}
function proPts(p){const T=S.targets.pro;return p>=T?2:p>=T-20?1:0}
function cardioMin(d){return (d.cardio||[]).reduce((a,c)=>a+(+c.min||0),0)}
function score(k){const d=get(k),t=totals(d),fx=fixture(k);const cal=calPts(t.cal,d.meals.length>0),pro=proPts(t.p),tr=(fx==='Rest'||liftDone(d))?2:0,ca=cardioMin(d)>0?2:0,cr=d.creatine?1:0;return{cal,pro,tr,ca,cr,total:cal+pro+tr+ca+cr,t,fx,d}}
const resOf=n=>n>=7?'W':n>=4?'D':'L';
const started=k=>k>=S.profile.start;
const isFinal=k=>k<todayK()||!!get(k).ft;
function result(k){if(!started(k)||k>todayK())return null;const sc=score(k);let r=resOf(sc.total);if(r==='L'&&sc.d.sub)r='S';return Object.assign(sc,{r,final:isFinal(k)})}
function lastFinal(){let k=todayK();return isFinal(k)?k:addDays(k,-1)}
function unbeaten(){let k=lastFinal(),n=0;while(started(k)){const r=result(k);if(!r||r.r==='L')break;n++;k=addDays(k,-1)}return n}
function formGuide(n){const out=[];let k=lastFinal();while(out.length<n&&started(k)){out.unshift(result(k).r);k=addDays(k,-1)}while(out.length<n)out.unshift('N');return out}
function longestRun(){let best=0,cur=0;let k=S.profile.start;const end=lastFinal();while(k<=end){const r=result(k);if(r&&r.r!=='L'){cur++;best=Math.max(best,cur)}else cur=0;k=addDays(k,1)}return best}
function gw(ws){const t=todayK();let pts=0,bonus=0,perfect=0,used=0,days=0;const res=[];for(let i=0;i<7;i++){const k=addDays(ws,i);if(k>t||!started(k))continue;const r=result(k);days++;pts+=r.total;res.push(r.r);if(r.total===10)perfect++;if(r.d.sub)used++;const pk=addDays(k,-1);if(r.r==='W'&&started(pk)){const pr=result(pk);if(pr&&pr.r==='L')bonus+=2}}return{ws,pts,bonus,total:pts+bonus,res,perfect,used,days,subsLeft:Math.max(0,Math.min(2,1+perfect)-used),complete:addDays(ws,6)<t}}
function comebackLive(k){const pk=addDays(k,-1);if(!started(pk))return false;const pr=result(pk);return !!(pr&&pr.r==='L')}
function canSub(k){const r=result(k);if(!r||r.r!=='L'||!r.final)return false;if(wkStart(k)!==wkStart(todayK()))return false;return gw(wkStart(k)).subsLeft>0}
function season(ym){const t=todayK();const [y,m]=ym.split('-').map(Number);const last=new Date(y,m,0).getDate();let W=0,D=0,L=0,Sn=0,pts=0,bonus=0;for(let i=1;i<=last;i++){const k=ym+'-'+pad(i);if(k>t||!started(k))continue;const r=result(k);if(!r.final)continue;({W:()=>W++,D:()=>D++,L:()=>L++,S:()=>Sn++})[r.r]();pts+=r.total;const pk=addDays(k,-1);if(r.r==='W'&&started(pk)){const pr=result(pk);if(pr&&pr.r==='L')bonus+=2}}const prs=history().sessions.filter(s=>s.date.startsWith(ym)).reduce((a,s)=>a+s.prs,0);return{W,D,L,S:Sn,pts:pts+bonus,prs}}
function matchMinute(){const d=new Date(),m=d.getHours()*60+d.getMinutes()-360;if(get(todayK()).ft)return 'FT';if(m<0)return 'Pre-match';return Math.min(90,Math.floor(m/1080*90))+"'"}

/* ---------- lift history ---------- */
let HM={v:-1,data:null};
function history(){if(HM.v===HV)return HM.data;const map={},sessions=[];Object.keys(S.days).sort().forEach(k=>{const w=S.days[k].wo;if(!w||!Array.isArray(w.ex))return;const sess={date:k,name:w.name||w.type||'Workout',dur:(w.end&&w.start)?w.end-w.start:0,sets:0,vol:0,prs:0,ex:[],status:w.status};w.ex.forEach(e=>{const sets=(e.sets||[]).filter(s=>s.done&&s.k!=='W'&&num(s.r)>0).map(s=>({w:num(s.w),r:num(s.r)}));if(!sets.length)return;const top=sets.reduce((b,s)=>s.w>b.w||(s.w===b.w&&s.r>b.r)?s:b,sets[0]);const vol=Math.round(sets.reduce((a,s)=>a+s.w*s.r,0));const e1=Math.max(...sets.map(s=>s.w*(1+s.r/30)));const pr=(e.sets||[]).some(s=>s.pr);(map[e.name]=map[e.name]||[]).push({date:k,sets,top,vol,e1,cat:e.cat});sess.sets+=sets.length;sess.vol+=vol;if(pr)sess.prs++;sess.ex.push({name:e.name,cat:e.cat,sets:sets.length,top,pr})});if(sess.sets)sessions.push(sess)});HM={v:HV,data:{map,sessions}};return HM.data}
const exHist=(n,excl)=>(history().map[n]||[]).filter(r=>r.date!==excl);
function prFor(name,w,r,k){const h=exHist(name,k);if(!h.length)return '';const e1=w*(1+r/30),maxE=Math.max(...h.map(x=>x.e1)),maxW=Math.max(...h.map(x=>x.top.w));if(w>maxW&&w>0)return 'Weight PR';if(e1>maxE+0.05)return 'Strength PR';const same=h.flatMap(x=>x.sets.filter(s=>s.w===w).map(s=>s.r));if(same.length&&r>Math.max(...same))return 'Rep PR';return ''}
function suggest(e){const h=exHist(e.name,todayK()),last=h.at(-1);if(!last)return{line:'First time logging this here. Set a baseline today.',tryTxt:'',stall:''};const w=last.top.w,r=last.top.r,bump=w>=40?5:2.5,parts=String(e.reps||'8–12').split(/[–-]/),hi=parseInt(parts[1]||parts[0],10)||12;const tryW=Math.round((w+bump)*2)/2;const sameW=last.sets.every(s=>s.w===last.sets[0].w);const line='Last time '+(sameW?last.sets[0].w+' × '+last.sets.map(s=>s.r).join(', '):last.sets.map(s=>s.w+' × '+s.r).join(', '))+'.';const tryTxt=r>=hi?tryW+' × '+Math.max(6,hi-4):w+' × '+(r+1);let stall='';if(h.length>=3){const l3=h.slice(-3);if(l3.every(x=>x.top.w===l3[0].top.w&&x.top.r===l3[0].top.r))stall='Same top set ('+l3[0].top.w+' × '+l3[0].top.r+') three sessions running. Try a different rep range, or drop the weight about 10% for a week and build back.'}return{line,tryTxt,stall}}
function prevFor(e,i){const last=exHist(e.name,todayK()).at(-1);if(!last)return null;return last.sets[i]||null}
function restFor(cat){const b=S.settings.baseRest||90;return ISO_CATS.includes(cat)?Math.min(b,60):cat==='Shoulders'?b:Math.max(b,120)}

/* ---------- player card ---------- */
function ratings(){const end=lastFinal();const ks=[];let k=end;while(ks.length<28&&started(k)){ks.push(k);k=addDays(k,-1)}const n=ks.length;const rs=ks.map(result);const avg=f=>n?rs.reduce((a,r)=>a+f(r),0)/n:0;const rate=r=>Math.round(40+59*clamp(r,0,1));
  const CAL=rate(avg(r=>r.cal/3));const PRO=rate((avg(r=>Math.min(1.05,r.t.p/S.targets.pro))-0.6)/0.4);
  const liftDays=rs.filter(r=>r.fx!=='Rest');const CON=rate(liftDays.length?liftDays.filter(r=>liftDone(r.d)).length/liftDays.length:0.5);
  const MOV=rate(avg(r=>Math.min(1,(r.d.steps||0)/S.targets.steps)));const LOG=rate(avg(r=>Math.min(1,r.d.meals.length/3)));
  let STR=60;const map=history().map,cut=addDays(end,-28),cut2=addDays(end,-56);const ch=[];Object.values(map).forEach(h=>{const a=h.filter(x=>x.date>cut&&x.date<=end),b=h.filter(x=>x.date>cut2&&x.date<=cut);if(a.length&&b.length){const ea=Math.max(...a.map(x=>x.e1)),eb=Math.max(...b.map(x=>x.e1));if(eb>0)ch.push((ea-eb)/eb)}});if(ch.length)STR=rate(0.5+(ch.reduce((x,y)=>x+y,0)/ch.length)*5);else{const any=Object.values(map).some(h=>h.some(x=>x.date>cut));STR=any?62:55}
  const st={CAL,PRO,STR,CON,MOV,LOG};const OVR=n?Math.round(.25*CAL+.2*PRO+.2*CON+.15*STR+.1*MOV+.1*LOG):50;return{st,OVR,n}}
function cardTier(o){const prev=gw(addDays(wkStart(todayK()),-7));if(prev.complete&&prev.total>=55)return 'inform';return o>=75?'gold':o>=65?'silver':'bronze'}
function snapRatings(){const wk=wkStart(todayK());if(S.snap&&S.snap.wk===wk)return;const r=ratings();S.snap={wk,st:r.st,OVR:r.OVR};touchProfile()}
function trophies(){const h=history();const ks=Object.keys(S.days).filter(started).filter(k=>k<=todayK()).sort();const res={};
  res.firstpro=ks.some(k=>totals(get(k)).p>=S.targets.pro);
  res.ontarget=ks.some(k=>isFinal(k)&&result(k).cal===3);
  let clean=false;const weeks=new Set(ks.map(wkStart));weeks.forEach(ws=>{const g=gw(ws);if(g.complete&&g.days===7&&!g.res.includes('L'))clean=true});res.clean=clean;
  res.hattrick=h.sessions.some(s=>s.prs>=3);res.sessions=h.sessions.length;res.centurion=h.sessions.length>=100;
  let inv=false;new Set(ks.map(k=>k.slice(0,7))).forEach(ym=>{const [y,m]=ym.split('-').map(Number);const last=ym+'-'+pad(new Date(y,m,0).getDate());if(last<todayK()){const s=season(ym);if(s.W+s.D+s.S>=20&&s.L===0)inv=true}});res.invincible=inv;return res}

const Sync={db:null,col:null,status:'local',dirty:new Set(),busy:false,timer:null,last:0};
function cap(name){try{return window.claude&&typeof window.claude.use==='function'?window.claude.use(name):Promise.resolve(null)}catch(e){return Promise.resolve(null)}}
function profileBody(){const o=clone(S);delete o.days;return o}
function monthDays(ym){const o={};Object.keys(S.days).forEach(k=>{if(k.startsWith(ym))o[k]=S.days[k]});return o}
function schedulePush(ms=1500){if(!Sync.col)return;clearTimeout(Sync.timer);Sync.timer=setTimeout(push,ms)}
async function push(){if(!Sync.col||Sync.busy)return;Sync.busy=true;try{for(const id of [...Sync.dirty]){Sync.dirty.delete(id);const body=id==='profile'?{u:S.u||Date.now(),state:profileBody()}:{u:Date.now(),days:monthDays(id.slice(2))};try{await Sync.col.doc(id).set(body)}catch(e){Sync.dirty.add(id);if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await Sync.col.doc(id).set(body);Sync.dirty.delete(id)}catch(e2){throw e2}}else throw e}}Sync.status='synced';Sync.last=Date.now()}catch(e){Sync.status=(e&&e.code==='quota_exceeded')?'full':'error'}finally{Sync.busy=false;paintSync();if(Sync.dirty.size&&Sync.status==='synced')schedulePush(2000)}}
async function pull(){if(!Sync.col)return;let snap;try{snap=await Sync.col.get()}catch(e){Sync.status='error';paintSync();return}let changed=false;const remoteDayU={};let sawProfile=false;snap.docs.forEach(doc=>{if(!doc.exists)return;const data=doc.data()||{};if(doc.id==='profile'){sawProfile=true;const rs=data.state;if(rs&&(data.u||0)>(S.u||0)){const days=S.days;S=normalize(Object.assign(clone(rs),{days}));S.u=data.u;changed=true}else if((S.u||0)>(data.u||0))Sync.dirty.add('profile')}else if(doc.id.startsWith('m-')){const days=data.days||{};Object.keys(days).forEach(k=>{remoteDayU[k]=days[k].u||0;const loc=S.days[k];if(!loc||(days[k].u||0)>(loc.u||0)){S.days[k]=clone(days[k]);changed=true}})}});Object.keys(S.days).forEach(k=>{if((S.days[k].u||0)>(remoteDayU[k]||0))Sync.dirty.add('m-'+k.slice(0,7))});if(!sawProfile&&S.onboarded)Sync.dirty.add('profile');Sync.status='synced';Sync.last=Date.now();if(changed){ensureKickoff();HV++;saveLocal();if(S.onboarded){$('#onboard').hidden=true;renderAll()}}paintSync();if(Sync.dirty.size)schedulePush(400)}
async function initSync(){const [db,user]=await Promise.all([cap('db'),cap('user')]);if(!db||!user){Sync.status='local';paintSync();return}let id=null;try{id=await user.id()}catch(e){}if(!id){Sync.status='local';paintSync();return}try{Sync.db=db;Sync.col=db.collection('data/users/'+id);await pull()}catch(e){Sync.col=null;Sync.status='local';paintSync()}}

function gaffer(){const k=todayK(),d=get(k),sc=result(k),t=sc.t,T=S.targets,h=new Date().getHours()+new Date().getMinutes()/60,need=7-sc.total;const fx=sc.fx;const cands=[];

  if(d.ft)return{text:`Full time. ${({W:'A win',D:'A draw',L:'A loss',S:'Sub used'})[sc.r]} with ${sc.total} points. ${sc.r==='L'?'Tomorrow is a comeback game: win it for 2 bonus points.':'Rest up and go again tomorrow.'}`,act:'',label:''};
  if(h<5)return{text:'Pre-match. Get some sleep, the day scores from breakfast.',act:'',label:''};
  if(!d.meals.length&&h<12)cands.push({g:0.5,text:'Kick-off. Log breakfast and aim for 40g of protein to set the pace.',act:'log',label:'Log breakfast'});
  if(fx!=='Rest'&&!liftDone(d)){const active=d.wo&&d.wo.status==='active';cands.push({g:2+(h>=15?0.6:0),text:active?`${d.wo.name} is in progress. Finish it for 2 points.${winTxt(2)}`:`${fx} is today’s fixture. That’s 2 points.${winTxt(2)}`,act:active?'go':'startFixture',arg:'train',label:active?'Resume':'Start '+fx})}
  const pNext=t.p>=T.pro?null:t.p>=T.pro-20?T.pro:T.pro-20;if(pNext!=null){const gap=pNext-t.p;const remCal=T.cal-t.cal;const opts=gotos().filter(m=>!m.combo&&m.p>=gap&&m.cal<=Math.max(150,remCal+100)).sort((a,b)=>a.cal-b.cal);const f=opts[0];cands.push({g:(gap<=50?1.4:0.9)-(h<12?0.6:0),text:`${gap}g more protein gets you another point.${winTxt(1)}${f?` ${f.name} (${f.p}g, ${fmt(f.cal)} kcal) covers it.`:''}`,act:f?'addGoto':'log',arg:f?foodKey(f):'',label:f?'Log '+f.name.split(' ').slice(0,3).join(' '):'Log food'})}
  const remCal=T.cal-t.cal;if(d.meals.length&&h>=12){if(remCal<0)cands.push({g:calKind()==='cut'?1.5:1.3,text:calKind()==='cut'?(-remCal<=BUF?`Your goal is ${fmt(T.cal)} and you’re ${fmt(-remCal)} over. That’s inside the ${BUF} kcal buffer, so all 3 calorie points are safe. The buffer covers estimate error, it isn’t extra to eat.`:`Your goal is ${fmt(T.cal)} and you’re ${fmt(-remCal)} over, ${fmt(-remCal-BUF)} past the buffer. Keep anything else today light and most of the calorie points hold.`):`You’re ${fmt(-remCal)} kcal over. Keep anything else today light and the calorie points mostly hold.`,act:'',label:''});else if(h>=16&&h<22)cands.push({g:1.1,text:`${fmt(remCal)} kcal left for today. Dinner around ${fmt(Math.max(0,remCal-150))} kcal with ${Math.max(30,Math.min(70,T.pro-t.p))}g of protein keeps all 3 calorie points.`,act:'log',label:'Log dinner'})}
  if(cardioMin(d)===0&&h>=14){cands.push({g:h>=18?2.2:1.2,text:`No cardio logged yet. Any kind counts for 2 points.${winTxt(2)}`,act:'cardio',label:'Log cardio'})}
  if(!d.creatine&&h>=9)cands.push({g:0.7,text:'Creatine is not logged yet. That is 1 point.',act:'creatine',label:'Log creatine'});
  if(h>=21.5&&d.meals.length)cands.push({g:2.5,text:'Late in the game. Log anything left from today, then blow full time.',act:'fulltime',label:'Blow full time'});
  if(comebackLive(k)&&sc.r!=='W')cands.push({g:0.8,text:`Yesterday was a loss. Win today and you get 2 comeback points on top.${need>0?` You need ${need} more.`:''}`,act:'',label:''});
  cands.sort((a,b)=>b.g-a.g);return cands[0]||{text:sc.r==='W'?'Winning. Hold the calories and see it out.':'Nothing urgent. Keep logging as you go.',act:'',label:''}}

function spark(vals,w,h){if(vals.length<2)return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"></svg>`;const mx=Math.max(...vals),mn=Math.min(...vals),r=Math.max(1,mx-mn);let best=-1;const pts=vals.map((v,i)=>[i/(vals.length-1)*(w-6)+3,h-3-(v-mn)/r*(h-6)]);const prs=[];vals.forEach((v,i)=>{if(v>best){if(i>0)prs.push(i);best=v}});return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--tr)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${prs.map(i=>`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="2.6" fill="var(--ink)"/>`).join('')}</svg>`}

let REST={end:0,ei:-1,total:0,doneAt:0};try{const r=JSON.parse(localStorage.getItem(REST_KEY)||'null');if(r&&r.end>Date.now())REST=r}catch(e){}
function startRest(sec,ei){REST={end:Date.now()+sec*1000,ei,total:sec,doneAt:0};try{localStorage.setItem(REST_KEY,JSON.stringify(REST))}catch(e){}paintDock()}
function endRest(){REST={end:0,ei:-1,total:0,doneAt:0};try{localStorage.removeItem(REST_KEY)}catch(e){}paintDock()}
function paintDock(){const el=$('#dock');const w=curWo();const left=(REST.end-Date.now())/1000;if(REST.end&&left>0){const pct=1-left/(REST.total||1);const e=w&&w.ex[REST.ei];const nxt=e?e.sets.find(s=>!s.done):null;el.hidden=false;el.innerHTML=`<div class="dock"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="var(--line2)" stroke-width="3.5"/><circle cx="20" cy="20" r="16" fill="none" stroke="var(--tr)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${(pct*100.5).toFixed(1)} 100.5" transform="rotate(-90 20 20)"/></svg><div><span class="t num" id="restT">${clockFmt(left)}</span><small>${e?(nxt?`Next: ${esc(e.name)}, ${nxt.w||'–'} × ${nxt.r||'–'}`:`${esc(e.name)} done`):'Rest'}</small></div><div class="acts"><button class="btn ghost sm" data-act="restAdd">+30</button><button class="btn sm" data-act="restSkip">Skip</button></div></div>`;return}
  if(REST.doneAt&&Date.now()-REST.doneAt<6000){el.hidden=false;el.innerHTML=`<div class="dock"><span class="t">Go</span><div><span>Rest done</span><small>Hit the next set.</small></div><div class="acts"><button class="btn sm" data-act="restSkip">OK</button></div></div>`;return}
  el.hidden=true;el.innerHTML=''}
let AC=null;function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function beep(){if(!S.settings.sound)return;try{unlockAudio();if(!AC)return;[0,0.22].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(0.2,AC.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t+0.18);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+0.2)})}catch(e){}}

function vProgress(){const k=todayK(),ym=PM,[y,m]=ym.split('-').map(Number);const se=season(ym);const first=new Date(y,m-1,1),lead=(first.getDay()+6)%7,last=new Date(y,m,0).getDate();const mname=first.toLocaleDateString('en-CA',{month:'long',year:'numeric'});
  let cells='';['M','T','W','T','F','S','S'].forEach(h=>cells+=`<span class="h">${h}</span>`);for(let i=0;i<lead;i++)cells+='<span></span>';for(let i=1;i<=last;i++){const kk=ym+'-'+pad(i);if(kk>k){cells+=`<span class="c future">${i}</span>`;continue}if(!started(kk)){cells+=`<button class="pre" data-act="dayDetail" data-arg="${kk}">${i}</button>`;continue}const r=result(kk);const a=0.07+r.total*0.086;cells+=`<button class="${kk===k?'today':''}" style="background:rgba(244,244,241,${a.toFixed(3)});color:${a>0.5?'#000':'var(--ink)'}" data-act="dayDetail" data-arg="${kk}" title="${shortDate(kk)}: ${r.total} points, ${resWord(r.r,r.final).toLowerCase()}">${i}<span class="rl">${r.final?r.r:''}</span></button>`}
  const wsNow=wkStart(k);const gws=[...Array(6)].map((_,i)=>addDays(wsNow,-7*(5-i))).map(ws=>({ws,g:gw(ws)}));
  const last14=[...Array(14)].map((_,i)=>addDays(k,i-13));
  const calVals=last14.map(kk=>({k:kk,v:started(kk)?totals(get(kk)).cal:0,on:started(kk)&&get(kk).meals.length>0}));const proVals=last14.map(kk=>({k:kk,v:started(kk)?totals(get(kk)).p:0,on:started(kk)&&get(kk).meals.length>0}));
  const logged=calVals.filter(x=>x.on);const avgCal=logged.length?Math.round(logged.reduce((a,x)=>a+x.v,0)/logged.length):0;const hitP=proVals.filter(x=>x.on&&x.v>=S.targets.pro).length;
  const vol=weekSets(wsNow);
  $('#v-progress').innerHTML=`<div class="vhead"><div><h1>Progress</h1><div class="sub">${esc(mname)} season${S.profile.start.slice(0,7)===ym?`, from ${shortDate(S.profile.start)}`:''}</div></div><div class="row"><button class="btn ghost sm" data-act="month" data-arg="-1" aria-label="Previous month">‹</button><button class="btn ghost sm" data-act="month" data-arg="1" aria-label="Next month" ${ym>=k.slice(0,7)?'disabled':''}>›</button></div></div>
  <section class="card"><div class="season"><div><b>${se.W}-${se.D}-${se.L}</b><small>Won, drew, lost${se.S?`, ${se.S} sub${se.S>1?'s':''}`:''}</small></div><div><b>${se.pts}</b><small>Points</small></div><div><b>${se.prs}</b><small>PRs</small></div><div><b>${longestRun()}</b><small>Best run</small></div></div></section>
  <section class="card"><div class="label"><span>Matchdays</span><b>Brighter means more points</b></div><div class="cal7">${cells}</div><div class="legendrow"><span><i style="background:rgba(244,244,241,.12)"></i>0</span><span><i style="background:rgba(244,244,241,.5)"></i>5</span><span><i style="background:rgba(244,244,241,.93)"></i>10</span><span>Letter is the result. Tap a day for detail.</span></div></section>
  <section class="card"><div class="label"><span>Form</span><b>Last 10</b></div>${guideHTML(formGuide(10))}</section>

  <section class="card"><div class="label"><span>Protein, last 14 days</span><b>${hitP} day${hitP===1?'':'s'} at ${S.targets.pro}g</b></div>${dayBars(proVals,S.targets.pro,'var(--pro)','g')}</section>
  <section class="card"><div class="label"><span>Sets this week by muscle</span><b>Target 10 to 20</b></div><div class="vol">${Object.keys(LIB).map(c=>{const n=vol[c]||0;return `<div class="r"><span>${c==='Hamstrings / Glutes'?'Hams, glutes':c}</span><span class="tr" title="${c}: ${n} sets this week"><span class="band"></span><span class="f" style="width:${clamp(n/25*100,0,100)}%"></span></span><b>${n}</b></div>`}).join('')}</div></section>`}
function weekSets(ws){const out={};for(let i=0;i<7;i++){const w=get(addDays(ws,i)).wo;if(!w||!w.ex)continue;w.ex.forEach(e=>{const n=(e.sets||[]).filter(s=>s.done&&s.k!=='W').length;if(n)out[e.cat]=(out[e.cat]||0)+n})}return out}
function gwBars(list){const W=300,H=132,base=104,top=20;const vals=list.map(x=>x.g.total);const max=Math.max(70,...vals);const done=list.filter(x=>x.g.complete&&x.g.days);const best=done.length?Math.max(...done.map(x=>x.g.total)):0;const bw=30,gap=(W-34-list.length*bw)/(list.length-1);let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Points for the last six gameweeks">`;s+=`<line x1="22" y1="${base}" x2="${W-4}" y2="${base}" stroke="var(--line2)"/>`;if(best){const y=base-best/max*(base-top);s+=`<line x1="22" y1="${y.toFixed(1)}" x2="${W-4}" y2="${y.toFixed(1)}" stroke="var(--ink3)" stroke-dasharray="3 4"/><text x="${W-4}" y="${(y-5).toFixed(1)}" text-anchor="end" class="ct">Best ${best}</text>`}
  list.forEach((x,i)=>{const g=x.g,v=g.total,px=28+i*(bw+gap),partial=!g.complete;const h=v/max*(base-top),y=base-h;const lab=shortDate(x.ws);if(v>=5)s+=`<path d="M${px},${base}V${(y+4).toFixed(1)}a4,4 0 0 1 4,-4H${px+bw-4}a4,4 0 0 1 4,4V${base}Z" fill="${partial?'none':'var(--ink)'}" stroke="${partial?'var(--ink2)':'none'}" stroke-width="1.5" ${partial?'stroke-dasharray="3 3"':''}><title>Week of ${lab}: ${v} points${g.bonus?` incl. ${g.bonus} comeback`:''}${partial?', in progress':''}</title></path>`;s+=`<text x="${px+bw/2}" y="${(Math.min(base,y)-6).toFixed(1)}" text-anchor="middle" class="cv">${g.days?v:'–'}</text><text x="${px+bw/2}" y="${base+15}" text-anchor="middle" class="ct">${lab}</text>`});return s+'</svg>'}
function dayBars(vals,target,color,unit,band){const W=300,H=126,base=100,top=14,x0=34;const max=Math.max(target*1.25,...vals.map(v=>v.v));const Y=v=>base-v/max*(base-top);const step=(W-x0-4)/vals.length,bw=Math.min(14,step*.62);let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily ${unit} for the last 14 days against target">`;if(band)s+=`<rect x="${x0}" y="${Y(band[1]).toFixed(1)}" width="${W-x0-4}" height="${(Y(band[0])-Y(band[1])).toFixed(1)}" fill="rgba(244,244,241,.07)"/>`;s+=`<line x1="${x0}" y1="${base}" x2="${W-4}" y2="${base}" stroke="var(--line2)"/><line x1="${x0}" y1="${Y(target).toFixed(1)}" x2="${W-4}" y2="${Y(target).toFixed(1)}" stroke="var(--ink3)" stroke-dasharray="3 4"/><text x="${x0-4}" y="${(Y(target)+3).toFixed(1)}" text-anchor="end" class="ct">${fmt(target)}</text><text x="${x0-4}" y="${base+3}" text-anchor="end" class="ct">0</text>`;
  vals.forEach((v,i)=>{const cx=x0+step*i+step/2;if(v.on&&v.v>0){const y=Y(v.v),h=base-y;s+=h>4?`<path d="M${(cx-bw/2).toFixed(1)},${base}V${(y+3).toFixed(1)}a3,3 0 0 1 3,-3H${(cx+bw/2-3).toFixed(1)}a3,3 0 0 1 3,3V${base}Z" fill="${color}"><title>${shortDate(v.k)}: ${fmt(v.v)} ${unit}</title></path>`:''}else s+=`<circle cx="${cx.toFixed(1)}" cy="${base-3}" r="1.5" fill="var(--line2)"/>`;if(i%2===1||i===vals.length-1)s+=`<text x="${cx.toFixed(1)}" y="${base+15}" text-anchor="middle" class="ct">${pdk(v.k).getDate()}</text>`});return s+'</svg>'}

function exportSheet(){openSheet('export','Export',`<div class="list"><button class="li" data-act="dlBackup"><span><span class="t">Backup file</span><span class="s">Everything, as JSON. Import it here any time.</span></span><span class="r">Save</span></button><button class="li" data-act="copyBackup"><span><span class="t">Copy backup</span><span class="s">Same backup, to your clipboard</span></span><span class="r">Copy</span></button><button class="li" data-act="dlCSV"><span><span class="t">Spreadsheet</span><span class="s">One row per day, as CSV</span></span><span class="r">Save</span></button></div><div class="sec"><div class="label"><span>Summary for an AI</span></div><div class="seg" style="margin-bottom:10px">${[['week','This week'],['month','Last 30 days'],['all','All time']].map(([v,l],i)=>`<button class="chipbtn ${i===0?'on':''}" data-act="aiRange" data-arg="${v}">${l}</button>`).join('')}</div><button class="btn wide" data-act="copyAI">Copy summary</button><p class="faint tiny" style="margin-top:8px">Paste it into any AI and ask what to change. Paste new targets back in with Paste.</p></div>`);Sheet.data={range:'week'}}

/* ---------- export helpers ---------- */
function backupJSON(){return JSON.stringify({form:1,exported:new Date().toISOString(),state:S})}
function csv(){const rows=[['date','result','points','calories','protein','carbs','fat','steps','water_ml','creatine','fixture','workout','sets']];Object.keys(S.days).sort().forEach(k=>{const d=S.days[k],t=totals(d),r=result(k);const s=history().sessions.find(x=>x.date===k);rows.push([k,r?r.r:'',r?r.total:'',t.cal,t.p,t.c,t.f,d.steps||0,d.water||0,d.creatine?1:0,fixture(k),d.wo?d.wo.name:'',s?s.sets:0])});return rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n')}
function aiSummary(range){const t=todayK();let ks=Object.keys(S.days).sort().filter(k=>k<=t);if(range==='week'){const ws=wkStart(t);ks=ks.filter(k=>k>=ws)}else if(range==='month')ks=ks.filter(k=>k>addDays(t,-30));const T=S.targets,r=ratings();const L=[];L.push('FORM FITNESS SUMMARY');L.push(`Name: ${S.profile.name}. Phase: ${S.profile.mode}. Targets: ${T.cal} kcal, ${T.pro}g protein, ${T.steps} steps.`);L.push('Scoring: calories 3 pts, protein 2, training 2 (rest days auto), cardio 2 (any logged cardio), creatine 1. Steps are tracked but do not score. Win 7+, draw 4-6, loss 0-3.');L.push(`Card: OVR ${r.OVR}; `+Object.entries(r.st).map(([a,b])=>a+' '+b).join(', ')+`. Unbeaten run ${unbeaten()}.`);L.push('');ks.forEach(k=>{const d=S.days[k],x=result(k),tt=totals(d);L.push(`${k} (${DOWS[pdk(k).getDay()]}) ${x?x.r+' '+x.total+'/10':''}: ${tt.cal} kcal, ${tt.p}P/${tt.c}C/${tt.f}F, ${d.steps||0} steps, fixture ${fixture(k)}`);d.meals.forEach(m=>L.push(`  food: ${m.name} (${m.cal}kcal, ${m.p}P/${m.c}C/${m.f}F, ${m.type})`));if(d.wo)d.wo.ex.forEach(e=>{const s=e.sets.filter(z=>z.done&&z.k!=='W');if(s.length)L.push(`  ${e.name}: `+s.map(z=>z.w+'x'+z.r).join(', ')+(e.sn?' — note: '+e.sn:''))})});return L.join('\n')}
async function saveFile(filename,data){const dl=IN_CLAUDE?await cap('downloads'):null;if(!dl){if(IN_CLAUDE){toast('Saving files isn’t available here. Use Copy instead.');return}try{const type=filename.endsWith('.csv')?'text/csv':'application/json';const file=new File([data],filename,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('Saved')}catch(e){if(e&&e.name==='AbortError')return;toast('Couldn’t save the file. Use Copy instead.')}return}try{await dl.save({filename,data});toast('Saved')}catch(e){if(e&&e.code==='declined')return;toast('Couldn’t save the file. Use Copy instead.')}}
function copy(text,msg){try{const p=navigator.clipboard&&navigator.clipboard.writeText(text);if(p&&p.then)p.then(()=>toast(msg||'Copied')).catch(()=>fallbackCopy(text,msg));else fallbackCopy(text,msg)}catch(e){fallbackCopy(text,msg)}}
function fallbackCopy(text){openSheet('copy','Copy this',`<p class="muted small" style="margin:0 0 8px">Select all and copy.</p><textarea style="min-height:220px" readonly>${esc(text)}</textarea>`);setTimeout(()=>{const t=$('#sheet textarea');if(t){t.focus();t.select()}},50)}
const AI_PROMPT=`Return ONLY valid JSON, no markdown. A JSON array of foods I ate:\n[{"name":"Chicken shawarma bowl","meal_type":"dinner","emoji":"🌯","calories":850,"protein_g":50,"carbs_g":95,"fat_g":28}]\nmeal_type is breakfast, lunch, dinner or snack. Numbers only. Split separate foods into separate items.`;

/* ---------- toast ---------- */
let TT=null,UNDO=null;
function toast(msg){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>`;t.classList.add('show');clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('show'),2600)}
function undoToast(msg,fn){UNDO=fn;const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span><button data-act="undo">Undo</button>`;t.classList.add('show');clearTimeout(TT);TT=setTimeout(()=>{t.classList.remove('show');UNDO=null},5000)}

function addOrReplaceEx(name,cat){const w=curWo();const tgt=Sheet.data&&Sheet.data.exTarget;const e=mkEx([name,cat,3,ISO_CATS.includes(cat)?'10–15':'8–12','']);const last=exHist(name,todayK()).at(-1);if(last)e.sets.forEach((s,i)=>{const ls=last.sets[i]||last.sets.at(-1);s.w=String(ls.w);s.r=String(ls.r)});if(tgt>=0)w.ex[tgt]=e;else w.ex.push(e);w.ex.forEach((x,i)=>x.open=x===e);touchDay();closeSheet();vTrain();const i=w.ex.indexOf(e);setTimeout(()=>{const el=$('#ex-'+i);if(el)el.scrollIntoView({block:'start',behavior:'smooth'})},60)}
function exercisePicker(target){const lib={};Object.entries(LIB).forEach(([c,a])=>lib[c]=[...a]);S.customExercises.forEach(x=>{(lib[x.cat]=lib[x.cat]||[]);if(!lib[x.cat].includes(x.name))lib[x.cat].push(x.name)});openSheet('picker',target>=0?'Swap exercise':'Add exercise',`<div class="review" style="margin-bottom:14px"><div class="grid2"><input id="cxName" placeholder="Custom exercise"><select id="cxCat">${Object.keys(LIB).map(c=>`<option>${c}</option>`).join('')}<option>Other</option></select></div><button class="btn sm" data-act="customEx">Add custom</button></div>${Object.entries(lib).map(([c,arr])=>`<div class="sec"><div class="label"><span>${c}</span></div><div class="list">${arr.map(n=>`<button class="li" data-act="pickEx" data-arg="${esc(n)}|${esc(c)}"><span class="t">${esc(n)}</span><span class="r">${exHist(n,'').length?exHist(n,'').length+' logged':''}</span></button>`).join('')}</div></div>`).join('')}`);Sheet.data={exTarget:target}}

function startOB(replay){OB={on:true,step:0,name:replay?S.profile.name:'',mode:replay?S.profile.mode:'',t:replay?Object.assign({},S.targets):{cal:'',pro:'',steps:'',water:''},fx:replay?Object.assign({},S.fixtures):{0:'',1:'',2:'',3:'',4:'',5:'',6:''},replay:!!replay,imported:0,err:''};$('#onboard').hidden=false;drawOB()}
function obDots(){return `<div class="obdots">${[1,2,3,4,5,6].map(i=>`<i class="${i<=OB.step?'on':''}"></i>`).join('')}</div>`}
const obErr=()=>OB.err?`<div class="err">${esc(OB.err)}</div>`:'';
function drawOB(){const el=$('#onboard');let h='';const back=OB.step>0?`<button class="btn ghost" data-act="obBack">Back</button>`:'';const nxt=(l='Next')=>`<div class="foot"><div class="row">${back}<button class="btn grow" data-act="obNext">${l}</button></div></div>`;
  if(OB.step===-1)h=`<h1>Restore a backup.</h1><p>Paste a Form backup to pick up exactly where you left off: record, history, goals and settings. In your other copy of Form, go to Card, then Export, then Copy backup.</p><textarea id="obRestore" style="min-height:170px" placeholder="Paste your backup here"></textarea>${obErr()}<div class="foot"><div class="row"><button class="btn ghost" data-act="obToSplash">Back</button><button class="btn grow" data-act="obRestore">Restore</button></div></div>`;
  if(OB.step===0)h=`<div class="splash"><svg class="pitch" viewBox="0 0 300 330" preserveAspectRatio="none" fill="none" stroke="rgba(244,244,241,.22)" stroke-width="1.4"><rect x="14" y="14" width="272" height="302" rx="6"/><path d="M14 165h272"/><circle cx="150" cy="165" r="48"/><rect x="95" y="14" width="110" height="46"/><rect x="95" y="270" width="110" height="46"/></svg><div class="guide">${['W','W','W','D','W'].map(r=>`<span class="res ${r}">${r}</span>`).join('')}</div><span class="wm">Form</span></div><h1>Your season starts today.</h1><p>Every day is a matchday scored out of 10. Win the day, protect your unbeaten run, and watch your player card climb. No scale, no red numbers.</p><div class="foot"><button class="btn wide" data-act="obNext">Set it up</button><button class="btn ghost wide" data-act="obRestoreOpen">Restore a Form backup</button><p class="faint tiny" style="text-align:center">Setup takes about a minute.</p></div>`;
  if(OB.step===1)h=`${obDots()}<h1>Let’s set you up.</h1><label class="field"><span>Your name, for your player card</span><input id="obName" value="${esc(OB.name)}" placeholder="Name"></label><div><div class="faint small" style="margin-bottom:8px">What are you working toward?</div><div class="list">${MODES.map(([v,l,d])=>`<button class="li" data-act="obMode" data-arg="${v}" style="padding:12px;border-radius:14px;margin-bottom:6px;border:1px solid ${OB.mode===v?'var(--ink)':'var(--line)'}"><span><span class="t">${l}</span><span class="s">${d}</span></span><span class="r">${OB.mode===v?ICON.check.replace('<svg','<svg width="20" height="20"'):''}</span></button>`).join('')}</div></div>${obErr()}${nxt()}`;
  if(OB.step===2)h=`${obDots()}<h1>Your daily targets.</h1><p>These decide your points. Change them any time in Card.</p><div class="grid2"><label class="bignum"><span class="faint small">Calories</span><input id="obCal" inputmode="numeric" value="${OB.t.cal}" placeholder="kcal a day"></label><label class="bignum"><span class="faint small">Protein</span><input id="obPro" inputmode="numeric" value="${OB.t.pro}" placeholder="grams"></label><label class="bignum"><span class="faint small">Steps</span><input id="obSteps" inputmode="numeric" value="${OB.t.steps}" placeholder="a day"></label><label class="bignum"><span class="faint small">Water</span><input id="obWater" inputmode="numeric" value="${OB.t.water}" placeholder="ml, optional"></label></div><p class="faint small">Use the numbers a coach, calculator or plan gave you. You can fine-tune them after a week.</p>${obErr()}${nxt()}`;
  if(OB.step===3)h=`${obDots()}<h1>Your training week.</h1><p>Pick what you do each day. Rest days earn the 2 training points automatically. Start from a preset, then tap any day to change it.</p><div class="seg">${Object.entries(PRESETS).map(([k,v])=>`<button class="chipbtn" data-act="obPreset" data-arg="${k}">${esc(v.label)}</button>`).join('')}</div><div>${[1,2,3,4,5,6,0].map(i=>`<div class="fxrow" style="margin-bottom:8px;grid-template-columns:96px minmax(0,1fr)"><span>${DOWL[i]}</span><button class="chipbtn ${OB.fx[i]&&OB.fx[i]!=='Rest'?'on':''}" style="justify-self:start" data-act="obFx" data-arg="${i}">${OB.fx[i]?esc(OB.fx[i]):'Tap to set'}</button></div>`).join('')}</div>${obErr()}${nxt()}`;
  if(OB.step===4)h=`${obDots()}<h1>How a matchday works.</h1><p>Up to 10 points a day. Seven wins it.</p>${howBody()}<div class="row wrap" style="gap:12px">${['W','D','L','S'].map(r=>`<span class="row" style="gap:8px"><span class="res ${r}">${r}</span><span class="small muted">${({W:'7 to 10',D:'4 to 6',L:'0 to 3',S:'Sub used'})[r]}</span></span>`).join('')}</div><p class="small">One sub a week keeps your unbeaten run alive on a bad day. Win the day after a loss and you get 2 bonus points. Blow full time each night to lock the day in.</p>${nxt('Got it')}`;
  if(OB.step===5)h=`${obDots()}<h1>What does what.</h1><p>Four tabs and one button. That’s the whole app.</p>${tourBody()}${nxt()}`;
  if(OB.step===6)h=`${obDots()}<h1>A normal day.</h1><p>Most days this takes a couple of minutes in total.</p>${routineBody()}${nxt()}`;
  if(OB.step===8)h=`<div class="splash" style="min-height:240px"><div class="guide">${['N','N','N','N','N'].map(()=>`<span class="res N">·</span>`).join('')}</div><span class="wm" style="font-size:96px">Kick-off</span></div><h1>${esc(OB.name)}, you’re set.</h1><p>${OB.imported?`${OB.imported} days of history came across for your lifts and go-tos. `:''}Your record starts at 0-0 and today is matchday one. ${fixture(todayK())==='Rest'?'It’s a rest day, so 2 points are already in.':`${esc(fixture(todayK()))} is on the fixture list.`} Start by logging what you’ve eaten so far.</p><div class="foot"><button class="btn wide" data-act="obFinish">Go to today</button></div>`;
  el.innerHTML=`<div class="ob">${h}</div>`;el.scrollTop=0}

  if(OB.step===1){OB.name=$('#obName').value.trim();if(!OB.name){OB.err='Add a name for your player card.';drawOB();return}if(!OB.mode){OB.err='Pick cut, maintain or bulk.';drawOB();return}}
  if(OB.step===2){const t={cal:nint($('#obCal').value),pro:nint($('#obPro').value),steps:nint($('#obSteps').value),water:nint($('#obWater').value)};if(!(t.cal>0&&t.pro>0&&t.steps>0)){OB.t={cal:t.cal||'',pro:t.pro||'',steps:t.steps||'',water:t.water||''};OB.err='Add calories, protein and steps. Water is optional.';drawOB();return}OB.t=t}
  if(OB.step===3&&[0,1,2,3,4,5,6].some(i=>!OB.fx[i])){OB.err='Set every day, or tap a preset to fill the week.';drawOB();return}
  OB.step++;if(OB.step===7)OB.step=8;if(OB.step===8)applyOB();drawOB()}
function applyOB(){S.profile.name=OB.name;S.profile.mode=OB.mode;S.targets=Object.assign({},OB.t);S.fixtures=Object.assign({},OB.fx);if(!OB.replay){S.profile.start=todayK();S.profile.kickoff=todayK()}S.profile.tourSeen=true;S.onboarded=true;touchProfile()}
function finishOB(){if(OB.step<8)applyOB();OB.on=false;$('#onboard').hidden=true;go('today');bootFx();schedulePush(200)}

/* ---------- ticking ---------- */
let LASTDAY=todayK(),LASTMIN='';
setInterval(()=>{const t=todayK();if(t!==LASTDAY){LASTDAY=t;HV++;renderAll();return}
  if(REST.end){const left=(REST.end-Date.now())/1000;if(left<=0){REST={end:0,ei:REST.ei,total:0,doneAt:Date.now()};try{localStorage.removeItem(REST_KEY)}catch(e){}beep();paintDock()}else{const rt=$('#restT');if(rt)rt.textContent=clockFmt(left);else paintDock();const c=$('#dock circle:nth-of-type(2)');if(c)c.setAttribute('stroke-dasharray',((1-left/(REST.total||1))*100.5).toFixed(1)+' 100.5')}}else if(REST.doneAt&&Date.now()-REST.doneAt>=6000){REST.doneAt=0;paintDock()}
  const w=curWo();const sc=$('#sessClock');if(w&&sc)sc.textContent=elapsedFmt(Date.now()-w.start);
  const mm=matchMinute();if(mm!==LASTMIN){LASTMIN=mm;const el=$('#minute span');if(el)el.textContent=mm}
},1000);
setInterval(()=>{const ae=document.activeElement;if(VIEW==='today'&&$('#sheetwrap').hidden&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))vToday()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(Sync.col)pull();renderAll()}syncWake()});

/* ---------- boot ---------- */
(function boot(){

  if(S.profile.start>todayK())S.profile.start=todayK();
  ensureKickoff();
  if(!S.onboarded)startOB(false);else{go('today');bootFx();if(!S.profile.tourSeen)setTimeout(()=>A.tour(),900)}
  paintDock();
  initSync();initAI();
  if(!IN_CLAUDE&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
